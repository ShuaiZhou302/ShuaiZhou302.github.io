<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="Visual input types preview: raw frames, temporal collage, contact sheet, neighbor collage, visual-hint overlay, hand crop">
  <style>
    .bg{fill:#fffaf1}
    .card{fill:#fffaf6;stroke:#d8c8b1;stroke-width:1.5}
    .title{font:700 20px "IBM Plex Sans",Arial,sans-serif;fill:#141414}
    .name{font:700 16px "IBM Plex Sans",Arial,sans-serif;fill:#141414}
    .sub{font:12.5px "IBM Plex Sans",Arial,sans-serif;fill:#4f4a42}
    .tiny{font:11px "IBM Plex Sans",Arial,sans-serif;fill:#554b40}
    .pred{fill:#2f7d70}
    .muted{fill:#d9d5cb}
    .ink{stroke:#2f7d70;stroke-width:3.5;fill:none;stroke-linecap:round}
    .arrow{stroke:#c85e25;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#c85e25"/>
    </marker>
  </defs>
  <rect class="bg" width="1180" height="520" rx="18"/>
  <text x="38" y="42" class="title">Visual input types preview</text>

  <!-- 1 Raw frames: separate images, not a collage grid -->
  <g transform="translate(38,68)">
    <rect class="card" width="352" height="200" rx="12"/>
    <text x="20" y="34" class="name">Raw frames</text>
    <text x="20" y="58" class="sub">Uniform samples, submitted separately</text>
    <g transform="translate(34,84)">
      <rect x="0" y="0" width="78" height="72" rx="6" fill="#e8e1d4" stroke="#cfc6b6"/>
      <rect x="98" y="0" width="78" height="72" rx="6" fill="#ddd6c8" stroke="#cfc6b6"/>
      <rect x="196" y="0" width="78" height="72" rx="6" fill="#d2cbc0" stroke="#cfc6b6"/>
      <text x="20" y="96" class="tiny">Frame 1</text>
      <text x="116" y="96" class="tiny">Frame 2</text>
      <text x="214" y="96" class="tiny">Frame 3</text>
    </g>
  </g>

  <!-- 2 Temporal collage -->
  <g transform="translate(414,68)">
    <rect class="card" width="352" height="200" rx="12"/>
    <text x="20" y="34" class="name">Temporal collage</text>
    <text x="20" y="58" class="sub">Several in-segment frames tiled as one</text>
    <g transform="translate(88,78)">
      <rect x="0" y="0" width="176" height="96" rx="8" fill="#f4eee4" stroke="#cfc6b6" stroke-width="2"/>
      <rect x="8" y="8" width="76" height="36" rx="4" fill="#e8e1d4"/>
      <rect x="92" y="8" width="76" height="36" rx="4" fill="#ddd6c8"/>
      <rect x="8" y="52" width="76" height="36" rx="4" fill="#d2cbc0"/>
      <rect x="92" y="52" width="76" height="36" rx="4" fill="#c8c1b6"/>
    </g>
  </g>

  <!-- 3 Contact sheet -->
  <g transform="translate(790,68)">
    <rect class="card" width="352" height="200" rx="12"/>
    <text x="20" y="34" class="name">Contact sheet</text>
    <text x="20" y="58" class="sub">Timestamped sampled-frame grid</text>
    <g transform="translate(54,78)">
      <rect x="0" y="0" width="244" height="100" rx="8" fill="#f4eee4" stroke="#cfc6b6" stroke-width="2"/>
      <g fill="#e0d8cb">
        <rect x="6" y="6" width="42" height="20" rx="2"/><rect x="54" y="6" width="42" height="20" rx="2"/><rect x="102" y="6" width="42" height="20" rx="2"/><rect x="150" y="6" width="42" height="20" rx="2"/><rect x="198" y="6" width="42" height="20" rx="2"/>
        <rect x="6" y="30" width="42" height="20" rx="2"/><rect x="54" y="30" width="42" height="20" rx="2"/><rect x="102" y="30" width="42" height="20" rx="2"/><rect x="150" y="30" width="42" height="20" rx="2"/><rect x="198" y="30" width="42" height="20" rx="2"/>
        <rect x="6" y="54" width="42" height="20" rx="2"/><rect x="54" y="54" width="42" height="20" rx="2"/><rect x="102" y="54" width="42" height="20" rx="2"/><rect x="150" y="54" width="42" height="20" rx="2"/><rect x="198" y="54" width="42" height="20" rx="2"/>
        <rect x="6" y="78" width="42" height="16" rx="2"/><rect x="54" y="78" width="42" height="16" rx="2"/><rect x="102" y="78" width="42" height="16" rx="2"/><rect x="150" y="78" width="42" height="16" rx="2"/><rect x="198" y="78" width="42" height="16" rx="2"/>
      </g>
      <g fill="#f2c84b">
        <rect x="8" y="8" width="14" height="5" rx="1"/><rect x="56" y="8" width="14" height="5" rx="1"/><rect x="104" y="8" width="14" height="5" rx="1"/><rect x="152" y="8" width="14" height="5" rx="1"/><rect x="200" y="8" width="14" height="5" rx="1"/>
        <rect x="8" y="32" width="14" height="5" rx="1"/><rect x="56" y="32" width="14" height="5" rx="1"/><rect x="104" y="32" width="14" height="5" rx="1"/><rect x="152" y="32" width="14" height="5" rx="1"/><rect x="200" y="32" width="14" height="5" rx="1"/>
        <rect x="8" y="56" width="14" height="5" rx="1"/><rect x="56" y="56" width="14" height="5" rx="1"/><rect x="104" y="56" width="14" height="5" rx="1"/><rect x="152" y="56" width="14" height="5" rx="1"/><rect x="200" y="56" width="14" height="5" rx="1"/>
      </g>
    </g>
  </g>

  <!-- 4 Neighbor collage -->
  <g transform="translate(38,292)">
    <rect class="card" width="352" height="200" rx="12"/>
    <text x="20" y="34" class="name">Neighbor collage</text>
    <text x="20" y="58" class="sub">Previous / current / next segment</text>
    <g transform="translate(40,84)">
      <rect x="0" y="0" width="78" height="72" rx="7" class="muted"/>
      <rect x="98" y="0" width="78" height="72" rx="7" class="pred"/>
      <rect x="196" y="0" width="78" height="72" rx="7" class="muted"/>
      <text x="14" y="96" class="tiny">Previous</text>
      <text x="116" y="96" class="tiny">Current</text>
      <text x="220" y="96" class="tiny">Next</text>
    </g>
  </g>

  <!-- 5 Visual-hint overlay -->
  <g transform="translate(414,292)">
    <rect class="card" width="352" height="200" rx="12"/>
    <text x="20" y="34" class="name">Visual-hint overlay</text>
    <text x="20" y="58" class="sub">Raw frame + motion cues</text>
    <g transform="translate(88,78)">
      <rect x="0" y="0" width="176" height="96" rx="8" fill="#e8e1d4"/>
      <circle cx="68" cy="54" r="18" fill="#c85e25" opacity=".22"/>
      <circle cx="108" cy="54" r="18" fill="#c85e25" opacity=".22"/>
      <path class="ink" d="M56 62 C72 34, 98 34, 118 62"/>
      <path class="arrow" d="M42 28 C64 16, 86 20, 104 32"/>
      <path class="arrow" d="M134 32 C116 18, 96 16, 78 26"/>
    </g>
  </g>

  <!-- 6 Hand-related inputs -->
  <g transform="translate(790,292)">
    <rect class="card" width="352" height="200" rx="12"/>
    <text x="20" y="34" class="name">Hand inputs</text>
    <text x="20" y="58" class="sub">Proxy crop vs HaWoR wrist crop</text>
    <g transform="translate(34,78)">
      <rect x="0" y="0" width="126" height="82" rx="8" fill="#e8e1d4"/>
      <rect x="28" y="22" width="72" height="38" rx="7" fill="none" stroke="#c85e25" stroke-width="3"/>
      <circle cx="50" cy="42" r="12" fill="#c85e25" opacity=".72"/>
      <circle cx="78" cy="42" r="12" fill="#c85e25" opacity=".72"/>
      <text x="14" y="106" class="tiny">Proxy collage</text>
      <rect x="154" y="0" width="126" height="82" rx="8" fill="#e8e1d4"/>
      <rect x="182" y="22" width="72" height="38" rx="7" fill="none" stroke="#2f7d70" stroke-width="3"/>
      <circle cx="204" cy="42" r="12" fill="#c85e25"/>
      <circle cx="232" cy="42" r="12" fill="#c85e25"/>
      <text x="164" y="106" class="tiny">HaWoR wrist crop</text>
    </g>
  </g>
</svg>
