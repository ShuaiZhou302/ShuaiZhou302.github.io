<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="t d">
  <title id="t">From whole-episode coarse segmentation to local refinement</title>
  <desc id="d">Processing order from human reference through whole-episode coarse segmentation and local-window selection to S2 local refinement.</desc>
  <defs><style>
    .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.axis{stroke:#d9d0c2;stroke-width:2}
    .gold{fill:#f0c94d}.coarse{fill:#9aa0a6}.good{fill:#2f6f66}
    .win{fill:#2f6f66;opacity:.10}.winline{stroke:#2f6f66;stroke-width:3;stroke-dasharray:7 5}
    .txt{font:16px "IBM Plex Sans",Arial,sans-serif}.mono{font:14px "IBM Plex Mono",monospace}
    .small{font-size:13px}.label{font-weight:700}
  </style></defs>
  <rect width="1120" height="500" rx="18" class="bg"/>
  <text x="42" y="46" class="txt label ink">From whole-episode coarse segmentation to local refinement</text>
  <text x="42" y="74" class="txt muted">Yellow is the human reference; gray is the initial result; green is re-estimated inside the local window.</text>

  <text x="42" y="140" class="txt label ink">Reference (eval only)</text>
  <text x="250" y="108" class="txt small muted">Yellow blocks = complete actions annotated by humans</text>
  <rect x="250" y="118" width="179" height="34" rx="6" class="gold"/>
  <rect x="432" y="118" width="119" height="34" rx="6" class="gold"/>
  <rect x="554" y="118" width="139" height="34" rx="6" class="gold"/>
  <rect x="696" y="118" width="179" height="34" rx="6" class="gold"/>
  <rect x="878" y="118" width="179" height="34" rx="6" class="gold"/>

  <text x="42" y="222" class="txt label ink">① Whole-episode pass</text>
  <text x="250" y="190" class="txt small muted">All timestamped grids → one model call → initial segments</text>
  <rect x="250" y="200" width="301" height="34" rx="6" class="coarse"/>
  <rect x="554" y="200" width="503" height="34" rx="6" class="coarse"/>

  <text x="42" y="304" class="txt label ink">② Select a window</text>
  <text x="250" y="272" class="txt small muted">Choose a short interval around one coarse boundary (green dashed lines)</text>
  <rect x="250" y="282" width="301" height="34" rx="6" class="coarse"/>
  <rect x="554" y="282" width="503" height="34" rx="6" class="coarse"/>
  <rect x="432" y="276" width="264" height="46" rx="8" class="win"/>
  <path d="M432 276v46M696 276v46" class="winline"/>

  <text x="42" y="386" class="txt label ink">③ S2 local refine</text>
  <text x="250" y="354" class="txt small muted">The model re-estimates action boundaries only inside the window</text>
  <rect x="250" y="364" width="179" height="34" rx="6" class="coarse"/>
  <rect x="432" y="364" width="119" height="34" rx="6" class="good"/>
  <rect x="554" y="364" width="139" height="34" rx="6" class="good"/>
  <rect x="696" y="364" width="361" height="34" rx="6" class="coarse"/>
  <path d="M432 358v46M696 358v46" class="winline"/>

  <line x1="250" y1="430" x2="1060" y2="430" class="axis"/>
  <text x="242" y="452" class="mono small muted">0</text>
  <text x="444" y="452" class="mono small muted">10</text>
  <text x="647" y="452" class="mono small muted">20</text>
  <text x="850" y="452" class="mono small muted">30</text>
  <text x="1052" y="452" class="mono small muted">40</text>
  <text x="1000" y="420" class="txt small muted">Time (s)</text>
</svg>