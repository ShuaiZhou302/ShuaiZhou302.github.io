<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">S2 local refinement + window setting + full-cover diagram</title>
  <desc id="desc">Three rows: coarse window with a mid boundary, pad=0 no pad-out, and completed actions to cut inside the window.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.axis{stroke:#d9d0c2;stroke-width:2}.coarse{fill:#9aa0a6}
      .pad{fill:#e8d4bf}.local{fill:#2f6f66}.event{fill:#f0c94d}.cut{stroke:#fff;stroke-width:3;stroke-dasharray:5 4}
      .txt{font:16px "IBM Plex Sans",Arial,sans-serif}.mono{font:15px "IBM Plex Mono",monospace}.small{font-size:13px}.label{font-weight:700}
    </style>
  </defs>
  <rect width="980" height="360" rx="18" class="bg"/>
  <text x="36" y="42" class="txt label ink">S2 local refinement + window setting + full-cover</text>
  <text x="36" y="68" class="txt muted">Read top to bottom: coarse window → how wide the refine view is → completed actions to cut.</text>
  <line x1="110" y1="120" x2="900" y2="120" class="axis"/>
  <text x="36" y="126" class="txt label ink">① Coarse</text>
  <rect x="265" y="102" width="390" height="36" rx="7" class="coarse"/>
  <line x1="460" y1="104" x2="460" y2="136" class="cut"/>
  <text x="318" y="126" class="mono" fill="#fff">coarse seg</text>
  <text x="488" y="126" class="mono" fill="#fff">coarse seg</text>
  <text x="430" y="94" class="txt small muted">boundary</text>
  <rect x="170" y="168" width="580" height="48" rx="9" class="pad"/>
  <rect x="265" y="174" width="390" height="36" rx="7" class="local"/>
  <text x="36" y="198" class="txt label ink">② Window</text>
  <text x="295" y="198" class="mono" fill="#fff">pad=0: stay inside</text>
  <text x="176" y="161" class="txt small muted">pad-out only</text>
  <text x="700" y="161" class="txt small muted">pad-out only</text>
  <text x="36" y="268" class="txt label ink">③ Cuts</text>
  <line x1="110" y1="262" x2="900" y2="262" class="axis"/>
  <rect x="290" y="244" width="108" height="36" rx="7" class="event"/><text x="318" y="268" class="mono ink">E1</text>
  <rect x="420" y="244" width="144" height="36" rx="7" class="event"/><text x="468" y="268" class="mono ink">E2</text>
  <rect x="585" y="244" width="54" height="36" rx="7" class="event"/><text x="600" y="268" class="mono ink">E3</text>
  <path d="M265 228v74M655 228v74" stroke="#2f6f66" stroke-width="4"/>
  <text x="276" y="330" class="txt small ink">Green guides mark the pad=0 window; yellow blocks are completed actions to cut inside it.</text>
</svg>
