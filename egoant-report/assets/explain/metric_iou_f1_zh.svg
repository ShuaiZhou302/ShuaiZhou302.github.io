<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Temporal IoU and F1 scoring diagram</title>
  <desc id="desc">A toy timeline showing gold segments, predicted segments, overlap, union, temporal matches, precision, recall, and F1.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.axis{stroke:#d9d0c2;stroke-width:2}
      .gold{fill:#f0c94d}.pred{fill:#2f6f66}.miss{fill:#bfc7ca}.mark{stroke:#c45c26;stroke-width:4}
      .box{fill:#f7f4ef;stroke:#d9d0c2;stroke-width:1.4}.txt{font:16px "IBM Plex Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .mono{font:15px "IBM Plex Mono",monospace}.small{font-size:13px}.label{font-weight:700}.sum{font-size:17px}.sumMono{font:16px "IBM Plex Mono",monospace}.flow{fill:none;stroke:#8a8378;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1120" height="470" rx="18" class="bg"/>
  <text x="42" y="48" class="txt label ink">评分示例：先做时间配对，再计算分段得分</text>
  <text x="42" y="78" class="txt muted">IoU = 两段重叠的时长 ÷ 两段合起来覆盖的总时长；达到 0.75 才能配对。</text>

  <line x1="150" y1="132" x2="1030" y2="132" class="axis"/>
  <line x1="150" y1="244" x2="1030" y2="244" class="axis"/>
  <text x="54" y="138" class="txt label ink">参考</text>
  <text x="34" y="250" class="txt label ink">预测（吸附后）</text>
  <g class="mono small muted">
    <text x="146" y="112">0s</text>
    <text x="410" y="112">3s</text>
    <text x="674" y="112">6s</text>
    <text x="1018" y="112">10s</text>
  </g>

  <rect x="150" y="118" width="264" height="38" rx="7" class="gold"/><text x="268" y="142" class="mono ink">G0</text>
  <rect x="414" y="118" width="264" height="38" rx="7" class="gold"/><text x="532" y="142" class="mono ink">G1</text>
  <rect x="678" y="118" width="352" height="38" rx="7" class="gold"/><text x="838" y="142" class="mono ink">G2</text>

  <rect x="150" y="230" width="246" height="38" rx="7" class="pred"/><text x="259" y="254" class="mono" fill="#fff">P0</text>
  <rect x="396" y="230" width="238" height="38" rx="7" class="pred"/><text x="501" y="254" class="mono" fill="#fff">P1</text>
  <rect x="634" y="230" width="220" height="38" rx="7" class="miss"/><text x="730" y="254" class="mono ink">P2</text>
  <rect x="854" y="230" width="176" height="38" rx="7" class="miss"/><text x="928" y="254" class="mono ink">P3</text>

  <path d="M150 164v44M396 164v44" class="mark"/>
  <path d="M414 164v44M634 164v44" class="mark"/>
  <text x="158" y="188" class="txt small ink">P0 与 G0 重叠足够</text>
  <text x="158" y="206" class="txt small muted">IoU ≈ 0.93 → 配对成功</text>
  <text x="424" y="188" class="txt small ink">P1 与 G1 重叠足够</text>
  <text x="424" y="206" class="txt small muted">IoU ≈ 0.78 → 配对成功</text>
  <text x="704" y="198" class="txt small muted">P2、P3 未达阈值</text>

  <rect x="70" y="310" width="980" height="124" rx="14" class="box"/>
  <text x="96" y="340" class="txt sum ink">① 统计分段数量</text>
  <text x="96" y="373" class="txt sum ink">成功配对分段数：<tspan class="sumMono">m = 2</tspan></text>
  <text x="96" y="405" class="txt sum ink">分段总数：<tspan class="sumMono">n</tspan><tspan class="sumMono" dy="4" style="font-size:9px">pred</tspan><tspan class="sumMono" dy="-4"> = 4，n</tspan><tspan class="sumMono" dy="4" style="font-size:9px">gold</tspan><tspan class="sumMono" dy="-4"> = 3</tspan></text>
  <path d="M335 375h26m-8-8 8 8-8 8" class="flow"/>
  <text x="392" y="340" class="txt sum ink">② 计算两个比例</text>
  <text x="392" y="373" class="txt sum ink">预测命中率：<tspan class="sumMono">2 / 4 = 0.50</tspan></text>
  <text x="392" y="405" class="txt sum ink">参考找回率：<tspan class="sumMono">2 / 3 = 0.67</tspan></text>
  <path d="M687 375h26m-8-8 8 8-8 8" class="flow"/>
  <text x="746" y="340" class="txt sum ink">③ 合并为视频分段得分</text>
  <text x="746" y="373" class="txt sum ink">视频分段 F1（Segment F1）</text>
  <text x="746" y="405" class="sumMono ink">2m / (n<tspan dy="4" style="font-size:9px">pred</tspan><tspan dy="-4"> + n</tspan><tspan dy="4" style="font-size:9px">gold</tspan><tspan dy="-4">) = 0.571</tspan></text>
</svg>
