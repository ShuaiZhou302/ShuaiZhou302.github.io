<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Wrist-speed valley cuts</title>
  <desc id="desc">Place cuts at valleys of the smoothed wrist-speed curve to obtain action segments.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.grid{stroke:#e5ddd1;stroke-width:1}.axis{stroke:#b9afa1;stroke-width:2}
      .left{fill:none;stroke:#2f6f66;stroke-width:5}.right{fill:none;stroke:#c45c26;stroke-width:5}
      .cut{stroke:#1c1914;stroke-width:2;stroke-dasharray:6 6}.pred{fill:#2f6f66}.bad{fill:#c45c26}
      .swatch{stroke:#fff;stroke-width:1.5}
      .txt{font:16px "IBM Plex Sans",Arial,sans-serif}.mono{font:14px "IBM Plex Mono",monospace}.small{font-size:14px}.label{font-weight:700}
    </style>
  </defs>
  <rect width="1120" height="480" rx="18" class="bg"/>
  <text x="42" y="46" class="txt label ink">Wrist-speed valley cuts</text>
  <text x="42" y="74" class="txt muted">After HaWoR reconstructs wrist tracks, place cuts at valleys of the smoothed wrist-speed curve.</text>

  <g transform="translate(760,34)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2f6f66" class="swatch"/>
    <text x="22" y="12" class="txt small ink">left wrist</text>
    <rect x="130" y="0" width="14" height="14" rx="3" fill="#c45c26" class="swatch"/>
    <text x="152" y="12" class="txt small ink">right wrist</text>
  </g>

  <g transform="translate(88,118)">
    <line x1="0" y1="250" x2="930" y2="250" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="250" class="axis"/>
    <g class="grid">
      <line x1="0" y1="62" x2="930" y2="62"/><line x1="0" y1="125" x2="930" y2="125"/><line x1="0" y1="188" x2="930" y2="188"/>
      <line x1="155" y1="0" x2="155" y2="250"/><line x1="310" y1="0" x2="310" y2="250"/><line x1="465" y1="0" x2="465" y2="250"/><line x1="620" y1="0" x2="620" y2="250"/><line x1="775" y1="0" x2="775" y2="250"/>
    </g>
    <path class="left" d="M0 228 C38 60,85 65,128 216 S214 60,270 218 S370 64,430 208 S525 110,588 224 S710 44,780 216 S875 95,930 195"/>
    <path class="right" d="M0 215 C45 120,84 80,135 200 S220 110,285 210 S385 76,445 222 S520 150,605 208 S716 72,780 228 S878 130,930 205"/>
    <g>
      <line x1="158" y1="0" x2="158" y2="330" class="cut"/>
      <line x1="305" y1="0" x2="305" y2="330" class="cut"/>
      <line x1="462" y1="0" x2="462" y2="330" class="cut"/>
      <line x1="625" y1="0" x2="625" y2="330" class="cut"/>
      <line x1="805" y1="0" x2="805" y2="330" class="cut"/>
    </g>
    <text x="8" y="-12" class="txt small muted">smoothed wrist speed</text>
    <text x="868" y="278" class="txt small muted">time →</text>

    <text x="0" y="312" class="txt label ink">Valley cuts</text>
    <rect x="8" y="292" width="142" height="28" rx="6" class="pred"/>
    <rect x="166" y="292" width="131" height="28" rx="6" class="bad"/>
    <rect x="313" y="292" width="141" height="28" rx="6" class="pred"/>
    <rect x="470" y="292" width="147" height="28" rx="6" class="bad"/>
    <rect x="633" y="292" width="164" height="28" rx="6" class="pred"/>
  </g>
</svg>
