<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">S2 局部精修 + 窗口设置 + 覆盖完整动作示意图</title>
  <desc id="desc">三行示意：粗分窗口（中间为粗边界）、pad=0 不外扩、以及窗口内应切出的完整动作。</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.axis{stroke:#d9d0c2;stroke-width:2}.coarse{fill:#9aa0a6}
      .pad{fill:#e8d4bf}.local{fill:#2f6f66}.event{fill:#f0c94d}.cut{stroke:#fff;stroke-width:3;stroke-dasharray:5 4}
      .txt{font:16px "IBM Plex Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}.mono{font:15px "IBM Plex Mono",monospace}.small{font-size:13px}.label{font-weight:700}
    </style>
  </defs>
  <rect width="980" height="360" rx="18" class="bg"/>
  <text x="36" y="42" class="txt label ink">S2 局部精修 + 窗口设置 + 覆盖完整动作</text>
  <text x="36" y="68" class="txt muted">先看粗分窗口，再决定精修看多大范围，最后在窗内切出完整动作。</text>
  <line x1="110" y1="120" x2="900" y2="120" class="axis"/>
  <text x="36" y="126" class="txt label ink">① 粗分</text>
  <rect x="265" y="102" width="390" height="36" rx="7" class="coarse"/>
  <line x1="460" y1="104" x2="460" y2="136" class="cut"/>
  <text x="362.5" y="126" text-anchor="middle" class="mono" fill="#fff">粗分片段</text>
  <text x="557.5" y="126" text-anchor="middle" class="mono" fill="#fff">粗分片段</text>
  <text x="460" y="94" text-anchor="middle" class="txt small muted">粗边界</text>
  <rect x="170" y="168" width="580" height="48" rx="9" class="pad"/>
  <rect x="265" y="174" width="390" height="36" rx="7" class="local"/>
  <text x="36" y="198" class="txt label ink">② 窗口</text>
  <text x="460" y="198" text-anchor="middle" class="mono" fill="#fff">pad=0：只看这一段</text>
  <text x="217.5" y="198" text-anchor="middle" class="txt small muted">向后看</text>
  <text x="702.5" y="198" text-anchor="middle" class="txt small muted">向前看</text>
  <text x="36" y="268" class="txt label ink">③ 切段</text>
  <line x1="110" y1="262" x2="900" y2="262" class="axis"/>
  <rect x="290" y="244" width="108" height="36" rx="7" class="event"/><text x="344" y="268" text-anchor="middle" class="mono ink">E1</text>
  <rect x="420" y="244" width="144" height="36" rx="7" class="event"/><text x="492" y="268" text-anchor="middle" class="mono ink">E2</text>
  <rect x="585" y="244" width="54" height="36" rx="7" class="event"/><text x="612" y="268" text-anchor="middle" class="mono ink">E3</text>
  <path d="M265 228v74M655 228v74" stroke="#2f6f66" stroke-width="4"/>
  <text x="276" y="330" class="txt small ink">绿色竖线标出 pad=0 窗口；黄色块是窗内应切出的完整动作。</text>
</svg>
