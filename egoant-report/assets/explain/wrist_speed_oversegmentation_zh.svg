<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">腕速低谷切段示意</title>
  <desc id="desc">腕速低谷可作切段信号，但停顿、微调和放手也会形成假边界，导致过分割。</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.grid{stroke:#e5ddd1;stroke-width:1}.axis{stroke:#b9afa1;stroke-width:2}
      .left{fill:none;stroke:#2f6f66;stroke-width:5}.right{fill:none;stroke:#c45c26;stroke-width:5}
      .cut{stroke:#1c1914;stroke-width:2;stroke-dasharray:6 6}.gold{fill:#f0c94d}.pred{fill:#2f6f66}.bad{fill:#c45c26}
      .swatch{stroke:#fff;stroke-width:1.5}
      .txt{font:16px "IBM Plex Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}.mono{font:14px "IBM Plex Mono",monospace}.small{font-size:14px}.label{font-weight:700}
    </style>
  </defs>
  <rect width="1120" height="560" rx="18" class="bg"/>
  <text x="42" y="46" class="txt label ink">腕速低谷切段：信号有用，但很容易过分割</text>
  <text x="42" y="74" class="txt muted">HaWoR 重建腕部轨迹后平滑腕速，并在速度低谷处切段。</text>

  <g transform="translate(820,34)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2f6f66" class="swatch"/>
    <text x="22" y="12" class="txt small ink">左手腕</text>
    <rect x="110" y="0" width="14" height="14" rx="3" fill="#c45c26" class="swatch"/>
    <text x="132" y="12" class="txt small ink">右手腕</text>
  </g>

  <g transform="translate(88,118)">
    <line x1="0" y1="250" x2="930" y2="250" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="250" class="axis"/>
    <g class="grid">
      <line x1="0" y1="62" x2="930" y2="62"/><line x1="0" y1="125" x2="930" y2="125"/><line x1="0" y1="188" x2="930" y2="188"/>
      <line x1="155" y1="0" x2="155" y2="250"/><line x1="310" y1="0" x2="310" y2="250"/><line x1="465" y1="0" x2="465" y2="250"/><line x1="620" y1="0" x2="620" y2="250"/><line x1="775" y1="0" x2="775" y2="250"/>
    </g>
    <path class="left" d="M0 228 C38 60,85 65,128 216 S214 60,270 218 S370 64,430 208 S525 110,588 224 S710 44,780 216 S875 95,930 195"/>
    <path class="right" d="M0 215 C45 120,84 80,135 200 S220 110,285 210 S385 76,445 222 S520 150,605 208 S716 72,780 228 S878 130,930 205"/>
    <g>
      <line x1="132" y1="0" x2="132" y2="268" class="cut"/><line x1="282" y1="0" x2="282" y2="268" class="cut"/>
      <line x1="448" y1="0" x2="448" y2="268" class="cut"/><line x1="608" y1="0" x2="608" y2="268" class="cut"/>
      <line x1="785" y1="0" x2="785" y2="268" class="cut"/>
    </g>
    <text x="8" y="-12" class="txt small muted">平滑后的腕部速度</text>
    <text x="900" y="278" class="txt small muted">时间 →</text>
  </g>

  <g transform="translate(88,430)">
    <text x="0" y="0" class="txt label ink">实际意图</text>
    <rect x="120" y="-18" width="700" height="28" rx="6" class="gold"/>
    <text x="390" y="2" class="mono ink">一次完整操作</text>
    <text x="0" y="52" class="txt label ink">低谷切段</text>
    <rect x="120" y="34" width="130" height="28" rx="6" class="pred"/>
    <rect x="255" y="34" width="145" height="28" rx="6" class="bad"/>
    <rect x="405" y="34" width="145" height="28" rx="6" class="pred"/>
    <rect x="555" y="34" width="125" height="28" rx="6" class="bad"/>
    <rect x="685" y="34" width="135" height="28" rx="6" class="pred"/>
    <text x="120" y="90" class="txt small muted">停顿、微调、放手都可能形成假边界</text>
  </g>
</svg>
