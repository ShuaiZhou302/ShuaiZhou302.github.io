<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Temporal IoU and F1 scoring diagram</title>
  <desc id="desc">A toy timeline showing gold segments, predicted segments, overlap, union, temporal matches, precision, recall, and F1.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.axis{stroke:#d9d0c2;stroke-width:2}
      .gold{fill:#f0c94d}.pred{fill:#2f6f66}.miss{fill:#bfc7ca}.mark{stroke:#c45c26;stroke-width:4}
      .box{fill:#f7f4ef;stroke:#d9d0c2;stroke-width:1.4}.txt{font:16px "IBM Plex Sans",Arial,sans-serif}
      .mono{font:15px "IBM Plex Mono",monospace}.small{font-size:13px}.label{font-weight:700}.sum{font-size:17px}.sumMono{font:16px "IBM Plex Mono",monospace}.flow{fill:none;stroke:#8a8378;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1120" height="540" rx="18" class="bg"/>
  <text x="42" y="48" class="txt label ink">Scoring example: temporal matching, then segmentation score</text>
  <text x="42" y="78" class="txt muted">IoU = overlap / union duration; a pair needs IoU ≥ 0.75 to match.</text>

  <line x1="150" y1="132" x2="1030" y2="132" class="axis"/>
  <line x1="150" y1="244" x2="1030" y2="244" class="axis"/>
  <text x="54" y="138" class="txt label ink">Gold</text>
  <text x="8" y="250" class="txt label ink">Pred (snapped)</text>
  <g class="mono small muted">
    <text x="146" y="112">0s</text>
    <text x="410" y="112">3s</text>
    <text x="674" y="112">6s</text>
    <text x="1018" y="112">10s</text>
  </g>

  <rect x="150" y="118" width="264" height="38" rx="7" class="gold"/><text x="268" y="142" class="mono ink">G₀</text>
  <rect x="414" y="118" width="264" height="38" rx="7" class="gold"/><text x="532" y="142" class="mono ink">G₁</text>
  <rect x="678" y="118" width="352" height="38" rx="7" class="gold"/><text x="838" y="142" class="mono ink">G₂</text>

  <rect x="150" y="230" width="246" height="38" rx="7" class="pred"/><text x="259" y="254" class="mono" fill="#fff">P₀</text>
  <rect x="396" y="230" width="238" height="38" rx="7" class="pred"/><text x="501" y="254" class="mono" fill="#fff">P₁</text>
  <rect x="634" y="230" width="220" height="38" rx="7" class="miss"/><text x="730" y="254" class="mono ink">P₂</text>
  <rect x="854" y="230" width="176" height="38" rx="7" class="miss"/><text x="928" y="254" class="mono ink">P₃</text>

  <path d="M150 164v44M396 164v44" class="mark"/>
  <path d="M414 164v44M634 164v44" class="mark"/>
  <text x="158" y="188" class="txt small ink">P₀ and G₀ overlap enough</text>
  <text x="158" y="208" class="txt small muted">IoU ≈ 0.93 → match</text>
  <text x="424" y="188" class="txt small ink">P₁ and G₁ overlap enough</text>
  <text x="424" y="208" class="txt small muted">IoU ≈ 0.78 → match</text>
  <text x="704" y="198" class="txt small muted">P₂ / P₃ below threshold</text>

  <rect x="48" y="300" width="1024" height="208" rx="14" class="box"/>
  <text x="78" y="340" class="txt sum ink">① Count segments</text>
  <text x="78" y="376" class="txt sum ink">Matched segments:</text>
  <text x="78" y="408" class="sumMono ink">m = 2</text>
  <text x="78" y="444" class="txt sum ink">Totals:</text>
  <text x="78" y="476" class="sumMono ink">n<tspan dy="4" style="font-size:11px">pred</tspan><tspan dy="-4"> = 4, n</tspan><tspan dy="4" style="font-size:11px">gold</tspan><tspan dy="-4"> = 3</tspan></text>

  <path d="M330 404h28m-8-8 8 8-8 8" class="flow"/>

  <text x="386" y="340" class="txt sum ink">② Compute two rates</text>
  <text x="386" y="376" class="txt sum ink">Prediction hit rate:</text>
  <text x="386" y="408" class="sumMono ink">2 / 4 = 0.50</text>
  <text x="386" y="444" class="txt sum ink">Reference recall:</text>
  <text x="386" y="476" class="sumMono ink">2 / 3 ≈ 0.67</text>

  <path d="M660 404h28m-8-8 8 8-8 8" class="flow"/>

  <text x="716" y="340" class="txt sum ink">③ Combine into Segment F1</text>
  <text x="716" y="376" class="txt sum ink">Segmentation score</text>
  <text x="716" y="408" class="sumMono ink">= 2m / (n<tspan dy="4" style="font-size:11px">pred</tspan><tspan dy="-4"> + n</tspan><tspan dy="4" style="font-size:11px">gold</tspan><tspan dy="-4">)</tspan></text>
  <text x="716" y="444" class="txt sum ink">Plug in m, n:</text>
  <text x="716" y="476" class="sumMono ink">= 2×2 / (4 + 3) ≈ 0.571</text>
</svg>
