<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">EgoANT recommended recipe flowchart</title>
  <desc id="desc">After segmentation, all four labeling inputs receive the predicted bounds; raw frames can go alone or join the other candidates into the selector.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}
      .ink{fill:#1c1914}
      .muted{fill:#5c564c}
      .arrow{stroke:#5c564c;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .seg{fill:#f4f0e8;stroke:#cbbfae;stroke-width:1.6}
      .lab{fill:#f7faf8;stroke:#b7cfc7;stroke-width:1.6}
      .box{fill:#fffdf8;stroke:#d9d0c2;stroke-width:1.4}
      .cand{fill:#eaf5ee;stroke:#0f6b5c;stroke-width:1.6}
      .inner{fill:#fff;stroke:#d9d0c2;stroke-width:1.2}
      .txt{font:16px "IBM Plex Sans",Arial,sans-serif}
      .small{font-size:13.5px}
      .tiny{font-size:12.5px}
      .pathlab{font:14.5px "IBM Plex Sans",Arial,sans-serif;font-weight:650}
      .label{font-weight:700}
    </style>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1.5 L11 6 L1 10.5 z" fill="#5c564c"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="18" class="bg"/>

  <rect x="8" y="242" width="108" height="52" rx="10" class="box"/>
  <text x="62" y="274" text-anchor="middle" class="txt label ink">Raw video</text>
  <line x1="116" y1="268" x2="148" y2="268" class="arrow" marker-end="url(#arr)"/>

  <rect x="148" y="146" width="300" height="220" rx="14" class="seg"/>
  <text x="298" y="176" text-anchor="middle" class="txt label ink">Segmentation</text>
  <text x="298" y="198" text-anchor="middle" class="txt tiny muted">sheets · coarse + refine</text>

  <rect x="168" y="232" width="74" height="78" rx="9" class="inner"/>
  <text x="205" y="266" text-anchor="middle" class="txt small label ink">Sheets</text>
  <text x="205" y="286" text-anchor="middle" class="txt tiny muted">0.5s</text>
  <line x1="242" y1="271" x2="262" y2="271" class="arrow" marker-end="url(#arr)"/>

  <rect x="262" y="232" width="74" height="78" rx="9" class="inner"/>
  <text x="299" y="266" text-anchor="middle" class="txt small label ink">Coarse</text>
  <text x="299" y="286" text-anchor="middle" class="txt tiny muted">+ rules</text>
  <line x1="336" y1="271" x2="356" y2="271" class="arrow" marker-end="url(#arr)"/>

  <rect x="356" y="232" width="74" height="78" rx="9" class="inner"/>
  <text x="393" y="266" text-anchor="middle" class="txt small label ink">Refine</text>
  <text x="393" y="286" text-anchor="middle" class="txt tiny muted">no pad</text>

  <rect x="528" y="36" width="424" height="448" rx="14" class="lab"/>
  <text x="740" y="66" text-anchor="middle" class="txt label ink">Labeling</text>
  <text x="740" y="88" text-anchor="middle" class="txt tiny muted">write descriptions on fixed bounds</text>

  <rect x="556" y="112" width="150" height="54" rx="10" class="cand"/>
  <text x="631" y="145" text-anchor="middle" class="txt label ink">Raw frames</text>
  <rect x="556" y="198" width="150" height="54" rx="10" class="cand"/>
  <text x="631" y="231" text-anchor="middle" class="txt label ink">ffmpeg</text>
  <rect x="556" y="284" width="150" height="54" rx="10" class="cand"/>
  <text x="631" y="317" text-anchor="middle" class="txt label ink">Seed</text>
  <rect x="556" y="370" width="150" height="54" rx="10" class="cand"/>
  <text x="631" y="403" text-anchor="middle" class="txt label ink">Prior</text>

  <line x1="448" y1="271" x2="510" y2="271" class="arrow"/>
  <line x1="510" y1="139" x2="510" y2="397" class="arrow"/>
  <line x1="510" y1="139" x2="556" y2="139" class="arrow" marker-end="url(#arr)"/>
  <line x1="510" y1="225" x2="556" y2="225" class="arrow" marker-end="url(#arr)"/>
  <line x1="510" y1="311" x2="556" y2="311" class="arrow" marker-end="url(#arr)"/>
  <line x1="510" y1="397" x2="556" y2="397" class="arrow" marker-end="url(#arr)"/>

  <path d="M706 139 H812 V250 H988" class="arrow" marker-end="url(#arr)"/>
  <text x="850" y="126" text-anchor="middle" class="pathlab muted">single-path</text>

  <line x1="736" y1="139" x2="736" y2="422" class="arrow"/>
  <line x1="706" y1="225" x2="736" y2="225" class="arrow"/>
  <line x1="706" y1="311" x2="736" y2="311" class="arrow"/>
  <line x1="706" y1="397" x2="736" y2="397" class="arrow"/>
  <line x1="736" y1="422" x2="780" y2="422" class="arrow" marker-end="url(#arr)"/>

  <rect x="780" y="396" width="140" height="52" rx="10" class="cand"/>
  <text x="850" y="428" text-anchor="middle" class="txt label ink">Selector</text>

  <path d="M920 422 H942 V286 H988" class="arrow" marker-end="url(#arr)"/>
  <text x="850" y="468" text-anchor="middle" class="pathlab muted">multi-candidate</text>

  <rect x="988" y="236" width="196" height="64" rx="12" class="box"/>
  <text x="1086" y="264" text-anchor="middle" class="txt label ink">Segments + labels</text>
  <text x="1086" y="286" text-anchor="middle" class="txt tiny muted">bounds + descriptions</text>
</svg>
