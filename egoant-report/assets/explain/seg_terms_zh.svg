<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="t d">
  <title id="t">分段术语示意图</title>
  <desc id="d">一条时间轴上并列展示参考分段、整集粗分、S1 加密切与 S2 局部精修，并标出时间窗口、pad=0 与 full-cover。</desc>
  <defs><style>
      .bg{fill:#fffdf8}.ink{fill:#1c1914}.muted{fill:#5c564c}.axis{stroke:#d9d0c2;stroke-width:2}
      .gold{fill:#f0c94d}.coarse{fill:#9aa0a6}.frag{fill:#c45c26;opacity:.75}.good{fill:#2f6f66}
      .win{fill:#2f6f66;opacity:.10}.winline{stroke:#2f6f66;stroke-width:3;stroke-dasharray:7 5}
      .box{fill:#f7f4ef;stroke:#d9d0c2;stroke-width:1.4}
      .txt{font:16px "IBM Plex Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}.mono{font:14px "IBM Plex Mono",monospace}.small{font-size:13px}.label{font-weight:700}
    </style></defs>
  <rect width="1120" height="600" rx="18" class="bg"/>
  <text x="42" y="48" class="txt label ink">一张图看完分段用到的几个词</text>
  <text x="42" y="76" class="txt muted">同一段 40 秒视频，四种切法叠在同一条时间轴上。</text>
  <rect x="432.2" y="360" width="263.2" height="48" rx="8" class="win"/>
  <path d="M432.2 360v48M695.5 360v48" class="winline"/>
  <text x="42" y="155" class="txt label ink">参考（人工）</text>
    <rect x="250.0" y="132" width="179.2" height="34" rx="6" class="gold"/>
    <rect x="432.2" y="132" width="118.5" height="34" rx="6" class="gold"/>
    <rect x="553.8" y="132" width="138.8" height="34" rx="6" class="gold"/>
    <rect x="695.5" y="132" width="179.2" height="34" rx="6" class="gold"/>
    <rect x="877.8" y="132" width="179.2" height="34" rx="6" class="gold"/>
  <text x="250" y="118" class="txt small muted">人工标注的完整动作</text>
  <text x="42" y="233" class="txt label ink">整集粗分</text>
    <rect x="250.0" y="210" width="300.8" height="34" rx="6" class="coarse"/>
    <rect x="553.8" y="210" width="503.2" height="34" rx="6" class="coarse"/>
  <text x="250" y="196" class="txt small muted">一次调用切完整集：假边界少，但切得太粗</text>
  <text x="42" y="311" class="txt label ink">S1 加密切</text>
    <rect x="250.0" y="288" width="78.0" height="34" rx="6" class="frag"/>
    <rect x="331.0" y="288" width="98.2" height="34" rx="6" class="frag"/>
    <rect x="432.2" y="288" width="57.8" height="34" rx="6" class="frag"/>
    <rect x="493.0" y="288" width="57.8" height="34" rx="6" class="frag"/>
    <rect x="553.8" y="288" width="57.8" height="34" rx="6" class="frag"/>
    <rect x="614.5" y="288" width="78.0" height="34" rx="6" class="frag"/>
    <rect x="695.5" y="288" width="78.0" height="34" rx="6" class="frag"/>
    <rect x="776.5" y="288" width="98.2" height="34" rx="6" class="frag"/>
    <rect x="877.8" y="288" width="78.0" height="34" rx="6" class="frag"/>
    <rect x="958.8" y="288" width="98.2" height="34" rx="6" class="frag"/>
  <text x="250" y="274" class="txt small muted">提高切段密度以抬召回：召回上去了，但切碎了</text>
  <text x="42" y="389" class="txt label ink">S2 局部精修</text>
    <rect x="250.0" y="366" width="179.2" height="34" rx="6" class="coarse"/>
    <rect x="432.2" y="366" width="118.5" height="34" rx="6" class="good"/>
    <rect x="553.8" y="366" width="138.8" height="34" rx="6" class="good"/>
    <rect x="695.5" y="366" width="361.5" height="34" rx="6" class="coarse"/>
  <text x="250" y="352" class="txt small muted">只在粗边界附近的时间窗口里重切一次</text>
  <line x1="250" y1="430" x2="1060" y2="430" class="axis"/>
  <text x="242" y="452" class="mono small muted">0</text>
  <text x="444" y="452" class="mono small muted">10</text>
  <text x="647" y="452" class="mono small muted">20</text>
  <text x="850" y="452" class="mono small muted">30</text>
  <text x="1052" y="452" class="mono small muted">40</text>
  <text x="1000" y="420" class="txt small muted">时间（秒）</text>
  <rect x="42" y="470" width="1036" height="94" rx="14" class="box"/>
  <text x="72" y="500" class="txt small ink">时间窗口（这里是 9–22 秒）</text>
  <text x="72" y="526" class="txt small ink">pad=0：窗口不外扩，看不到窗外的相邻动作</text>
  <text x="72" y="552" class="txt small ink">full-cover：窗口内看得见的完成动作都要切到</text>
</svg>